<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Reset Lead Finder</title>
  <style>
    :root{font-family:Inter,Arial,sans-serif;color:#111827;background:#f3f4f6}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(680px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:44px;box-shadow:0 24px 70px rgba(17,24,39,.10)}
    .eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:#6b7280}
    h1{font-size:clamp(36px,7vw,68px);line-height:.95;margin:18px 0}p{font-size:18px;line-height:1.6;color:#4b5563}
    a{display:inline-flex;justify-content:center;width:100%;margin-top:22px;padding:16px 22px;border-radius:14px;background:#111827;color:white;text-decoration:none;font-weight:700}
    small{display:block;margin-top:18px;color:#9ca3af}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Reset İletişim · Private Tool</div>
    <h1>Lead Finder</h1>
    <p>Hedef şirketlerden karar vericileri bulur, kurumsal e-posta adaylarını doğrular ve CRM çıktısı üretir.</p>
    <a id="openApp" href="#">Uygulamayı Aç</a>
    <small>Yetkili kullanıcılar içindir.</small>
  </main>
  <script src="config.js"></script>
  <script>
    const target = window.RESET_LEAD_FINDER_URL || "";
    const button = document.getElementById("openApp");
    if (target.includes("YOUR-APP")) {
      button.textContent = "Önce config.js içindeki uygulama URL'sini değiştir";
      button.addEventListener("click", (e) => e.preventDefault());
    } else {
      button.href = target;
    }
  </script>
</body>
</html>
