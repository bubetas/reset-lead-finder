services:
  - type: web
    name: reset-lead-finder
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TAVILY_API_KEY
        sync: false
      - key: ABSTRACT_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
